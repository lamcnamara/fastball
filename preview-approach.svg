<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 571" width="850" height="571" role="img" aria-labelledby="title desc">
<title id="title">Fastball Orbital approach chart — capture confirmed</title>
<desc id="desc">The hatch is the origin. Positive V-bar points left along the orbit and positive R-bar points down toward Earth. The suit begins 10.4 metres behind and 14.3 metres outward, releases the wrench pouch at 1:30 and the battery at 4:00, and enters the 1.2 metre reach zone at 6:43.</desc>
<style>
  text{font-family:Arial,sans-serif;fill:#f0f2ec}
  .brand{font-size:14px;font-weight:700;letter-spacing:2px}.meta,.kicker,.tick,.time,.datum,.num{font-family:Consolas,monospace}
  .meta{font-size:14px;fill:#bdcac4}.kicker{font-size:12px;letter-spacing:1.3px;font-weight:700;fill:#9cb8aa}
  .title{font-size:38px;letter-spacing:-1px;font-weight:700}.sub{font-size:16px;fill:#bfccc6}
  .label{font-size:14px;fill:#c5d2cc}.tick{font-size:12px;fill:#9eafa9}.axisLabel{font-size:13px;fill:#cfdbd4}
  .event{font-size:17px;font-weight:700}.time{font-size:14px;fill:#e6c99b}.stat{font-size:22px;font-weight:700}
  .grid{stroke:#30403e;stroke-width:.8}.axis{stroke:#879c93;stroke-width:1.25}.divider{stroke:#40514e;stroke-width:1}
  .rail{fill:#213c34;stroke:#96ddbb;stroke-width:1.5;stroke-dasharray:4 3}
  .flight{fill:none;stroke:#ead2a6;stroke-width:3.3;stroke-linecap:round;stroke-linejoin:round}
  .throw{fill:#202926;stroke:#e8c99a;stroke-width:2}.num{text-anchor:middle;font-weight:700;font-size:12px;fill:#f3d8ac}
  .finish{fill:#a4ebc7;stroke:#14211d;stroke-width:2}.datum{font-size:14px;fill:#ced9d3}
</style>
