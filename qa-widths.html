      yes(course(5,0,1,0).eta===null,&#39;receding&#39;);near(course(0,0,0,0).eta,0,&#39;inside&#39;);
    });
    test(&#39;Oxygen expiry, empty rack loss, final tool rescue and deadline tie&#39;,()=&gt;{
      newFlight(0,&#39;Hard&#39;);toggleClock();advance(999);yes(state.result.title===&#39;Oxygen depleted&#39;,&#39;oxygen end&#39;);near(state.elapsed,450,&#39;deadline&#39;);
      closeDialog(false);newFlight();state.mask=1;state.selected=0;state.bearing=180;throwTool();yes(state.result.title===&#39;Return lost&#39;,&#39;empty&#39;);

    });

      beginCharge(&#39;key&#39;);charge.start=performance.now()-1900;document.body.dispatchEvent(new KeyboardEvent(&#39;keyup&#39;,{code:&#39;Space&#39;,bubbles:true}));

      yes(state.index===2 &amp;&amp; state.oxygen===600 &amp;&amp; state.throws===0 &amp;&amp; state.mask===63,&#39;reset&#39;);
      const b=$(&#39;plot&#39;).getBoundingClientRect();

      yes(document.documentElement.scrollWidth&lt;=innerWidth+1,&#39;horizontal overflow &#39;+document.documentElement.scrollWidth+&#39; &#39;+innerWidth);
    });
    output.textContent=&#39;PASS &#39;+passed.length+&#39; groups at &#39;+innerWidth+&#39;px: &#39;+passed.join(&#39; | &#39;);
  }catch(e){output.textContent=&#39;FAIL after &#39;+passed.length+&#39;: &#39;+e.message+&#39; / &#39;+e.stack;}
})();

];
const limits = {Easy:900, Medium:600, Hard:450};
const dryMass = 186, captureRadius = 1.2, fullMask = (1 &lt;&lt; gear.length)-1;
const massOf = mask =&gt; gear.reduce((sum,t,i)=&gt;sum + ((mask &amp; (1&lt;&lt;i)) ? t.mass : 0),dryMass);
const budgets = new Map([[0,0]]);

  if (!budgets.has(mask)) {
    const mass = massOf(mask);

    gear.forEach((t,i) =&gt; {

    budgets.set(mask,best);
  }
  return budgets.get(mask);
}
function course(x,y,vx,vy) {
  const vv = vx*vx + vy*vy, dot = x*vx+y*vy;
  const t = vv ? Math.max(0,-dot/vv) : 0;
  const clearance = Math.max(0,Math.hypot(x+t*vx,y+t*vy)-captureRadius);

  let eta = null;
  if (c &lt;= 0) eta = 0;
  else if (dot &lt; 0 &amp;&amp; vv &gt; 0) {
