.bar,main { width:min(1920px,100%); padding-inline:clamp(12px,3vw,58px) }
.bar { padding-block:11px }
.brand&gt;svg { width:33px; height:33px }
.wordmark { font-size:18px }
main { padding-block:16px }
.mission { margin-bottom:14px }
h1 { font-weight:580; font-size:clamp(26px,2.4vw,38px) }
.quiet,.settings select { padding:7px 10px; font-size:13px }
.panel { border-radius:6px }
.panelhead { padding:9px 15px; min-height:37px }
.scene { position:relative; isolation:isolate; --inset:clamp(12px,1.45vw,27px); background:#090d10 }
.scene&gt;svg { width:100%; height:clamp(425px,56svh,790px); display:block; touch-action:none; user-select:none; cursor:crosshair }
.scene #reticle { cursor:grab }
.scene&gt;svg.aiming,.scene&gt;svg.aiming #reticle { cursor:grabbing }
.scene&gt;svg:focus-visible { outline-offset:-3px }
.scene::before,.scene::after { content:&quot;&quot;; pointer-events:none; position:absolute; left:23%; right:23%; height:5px; opacity:.45; background:repeating-linear-gradient(90deg,#879696 0 1px,transparent 1px 12px); mask-image:linear-gradient(90deg,transparent,#000 18% 82%,transparent) }
.scene::before { top:0 }
.scene::after { bottom:0 }
.hud { position:absolute; pointer-events:none; text-shadow:0 1px 4px #06090b; font-variant-numeric:tabular-nums }
.hud.left { left:var(--inset) }
.hud.right { right:var(--inset); text-align:right }
.primary-hud { top:var(--inset); padding:2px 10px 4px; border-left:2px solid #7c8d85; background:linear-gradient(90deg,#11191d99,transparent) }
.primary-hud.right { border:0; border-right:2px solid #7c8d85; background:linear-gradient(270deg,#11191d99,transparent) }
.hud .micro { color:#acb8b8; font-size:9px }
.big { margin-top:1px; font-size:clamp(25px,2.2vw,36px); color:#d7e6dd }
.big small,.hud small { color:var(--muted); font:10px var(--mono) }
.meter { height:3px; width:104px; margin-top:6px }
.side-hud { top:44%; display:grid; gap:13px }
.side-hud b { display:block; margin-top:2px; font:17px/1.15 var(--mono); letter-spacing:-.035em }
.raw { display:grid; grid-template-columns:auto auto; gap:6px 13px; align-items:baseline; font:10px var(--mono); color:var(--muted) }
.raw b { font:12px var(--mono); color:var(--ink); margin:0 }
.raw span { text-align:left }
.assist { bottom:var(--inset); padding-right:10px; border-right:2px solid #827764; color:#c8cecd; font:11px/1.5 var(--mono); background:linear-gradient(270deg,#0c1013bb,transparent) }
.assist .micro { color:var(--gold); margin-bottom:2px }
.assist strong { font-weight:normal; color:var(--ink) }
.plotbar { position:relative; display:flex; align-items:center; justify-content:space-between; gap:12px; border-top:1px solid var(--edge); padding:5px 14px; min-height:33px }
.legend,.speed,.flight-time { color:var(--muted); font:10px var(--mono) }
.legend { gap:15px }
.legend span { display:flex; align-items:center; gap:5px }
.keyline { width:15px; border-top:2px dotted var(--mint) }
.keyline.vector { border-top:2px solid #a9b8c5 }
.keyline.recoil { border-top:2px dashed var(--gold) }
.speed { display:flex; align-items:center; gap:2px }
.speed&gt;svg { width:14px; height:14px; stroke:var(--muted); fill:none; margin-right:3px }
.speed button { padding:4px 7px; background:transparent; font:11px var(--mono); border-color:transparent }
.speed .active { color:var(--mint); background:#29332f; border-color:#4c5c54 }
.flight-time { margin-left:auto; font-variant-numeric:tabular-nums }
.flight-time b { color:var(--ink); font-weight:400 }
.rack { margin-top:12px }
.tools { padding:6px 12px 11px; gap:7px }
.tool { display:grid; grid-template-columns:minmax(40px,.9fr) minmax(0,1.5fr); align-items:center; gap:5px; min-height:64px; padding:6px 7px; background:#1c2123 }
.tool.selected { border-color:#91a398; background:#27302b; box-shadow:inset 0 -2px var(--mint) }
.tool b { font-size:12px }
.tool svg { width:100%; height:39px }
.throwstrip { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 14px; background:#181c1e; border-top:1px solid var(--edge); color:#c6cdca; font-size:12px }
.throw-vector { color:var(--gold); font:12px var(--mono); white-space:nowrap }
.throw-vector .micro { margin-right:6px }
.advisory { margin-top:12px }
.reticle-text { font:10px var(--mono); fill:var(--gold); paint-order:stroke; stroke:#0c1013; stroke-width:3px; stroke-linejoin:round }
@media(max-width:940px) {
  .tool { display:block; padding:6px 9px 9px }
  .tool svg { height:33px }
}
@media(max-width:720px) {
  .bar,main { padding-inline:12px }
  .mission { align-items:center; flex-wrap:wrap; margin-bottom:10px }
  .primary-hud { padding-inline:7px }
  .side-hud { top:82px; gap:7px }
  .side-hud b { font-size:13px }
  .raw { gap:3px 8px }
  .raw b { font-size:11px }
  .tools { grid-template-columns:repeat(3,minmax(0,1fr)) }
  .tool { display:grid; min-height:55px }
  .throwstrip { align-items:flex-start; flex-wrap:wrap; gap:4px 12px }
  .assist { font-size:10px; max-width:72% }
  .flight-time { position:absolute; left:15px; bottom:calc(100% + 35px); font-size:9px; pointer-events:none }
}
@media(max-width:450px) {
  .bar,main { padding-inline:8px }
  .brand { gap:7px }
  .wordmark { font-size:15px }
  .brand&gt;svg { width:27px; height:27px }
  .tag { display:none }
  .settings { gap:5px }
  .scene&gt;svg { height:clamp(405px,58svh,545px) }
  .panelhead { padding-inline:9px }
  .status { font-size:9px; max-width:49%; text-align:right }
  .plotbar { padding:5px 6px; gap:4px }
  .legend { font-size:9px; gap:6px }
  .keyline { width:9px }
  .speed { gap:0 }
  .speed&gt;svg { display:none }
  .speed button { padding:5px 4px; font-size:10px }
  .tools { padding:4px 6px 7px; gap:4px }
  .tool { display:block; min-height:67px; padding:4px 5px 6px }
  .tool svg { height:30px }
  .tool b { font-size:11px }
  .advisory { display:block }
}

const dryMass = 186, captureRadius = 1.2, fullMask = (1 &lt;&lt; gear.length)-1;

}
function course(x,y,vx,vy) {
  const vv = vx*vx + vy*vy, dot = x*vx+y*vy;

  if (c &lt;= 0) eta = 0;
  else if (dot &lt; 0 &amp;&amp; vv &gt; 0) {

}

        yes(!drag &amp;&amp; state.mask===63 &amp;&amp; state.throws===0 &amp;&amp; state.bearing===0 &amp;&amp; state.power===65,action);
      }
    });
    test(&#x27;Paused or ended missions and an empty rack ignore pointer input&#x27;,()=&gt;{
      for(const phase of [&#x27;paused&#x27;,&#x27;ended&#x27;,&#x27;empty&#x27;]){

        pointer(&#x27;pointerdown&#x27;,0,0);pointer(&#x27;pointerup&#x27;,camera.reach,0);
        yes(!drag &amp;&amp; !state.throws &amp;&amp; state.power===65,phase);
      }
    });
    test(&#x27;Keyboard precision aiming, power limits and plot release&#x27;,()=&gt;{
      key(&#x27;ArrowLeft&#x27;,true);key(&#x27;ArrowRight&#x27;);near(state.bearing,9,&#x27;angle steps&#x27;);
      key(&#x27;ArrowUp&#x27;);near(state.power,66,&#x27;power step&#x27;);
      for(let i=0;i&lt;10;i++)key(&#x27;ArrowUp&#x27;,true);near(state.power,100,&#x27;cap&#x27;);
      for(let i=0;i&lt;10;i++)key(&#x27;ArrowDown&#x27;,true);near(state.power,10,&#x27;floor&#x27;);
      key(&#x27;Enter&#x27;);yes(state.throws===1,&#x27;keyboard release&#x27;);
    });
    test(&#x27;Menu configuration, full-power reach and narrow layout&#x27;,()=&gt;{
      $(&#x27;setup&#x27;).click();$(&#x27;scenarioChoice&#x27;).value=&#x27;2&#x27;;$(&#x27;levelChoice&#x27;).value=&#x27;Medium&#x27;;$(&#x27;dialogActions&#x27;).lastElementChild.click();
      yes(state.index===2 &amp;&amp; state.oxygen===600 &amp;&amp; state.throws===0 &amp;&amp; state.mask===63,&#x27;reset&#x27;);
      for(const [dx,dy] of [[1,0],[0,1],[-1,0],[0,-1]]){
        pointer(&#x27;pointerdown&#x27;,dx*camera.reach,dy*camera.reach);
        near(state.power,100,&#x27;reach&#x27;);yes(drag.inside,&#x27;reticle outside&#x27;);pointer(&#x27;pointerup&#x27;,dx*camera.reach,dy*camera.reach);
      }
      yes(document.documentElement.scrollWidth&lt;=innerWidth+1,&#x27;horizontal overflow &#x27;+document.documentElement.scrollWidth+&#x27; &#x27;+innerWidth);
    });
    output.textContent=&#x27;PASS &#x27;+passed.length+&#x27; groups at &#x27;+innerWidth+&#x27;px: &#x27;+passed.join(&#x27; | &#x27;);
  }catch(e){output.textContent=&#x27;FAIL after &#x27;+passed.length+&#x27;: &#x27;+e.message+&#x27; / &#x27;+e.stack;}
})();

    test(&#x27;Grazing, stationary, receding and already captured trajectories&#x27;,()=&gt;{
      near(course(5,1.2,-1,0).eta,5,&#x27;tangent&#x27;);yes(course(5,1.21,-1,0).eta===null,&#x27;near miss&#x27;);yes(course(5,0,0,0).eta===null,&#x27;stationary&#x27;);
      yes(course(5,0,1,0).eta===null,&#x27;receding&#x27;);near(course(0,0,0,0).eta,0,&#x27;inside&#x27;);
    });
    test(&#x27;Oxygen expiry, empty rack loss, final tool rescue and deadline tie&#x27;,()=&gt;{
      newFlight(0,&#x27;Hard&#x27;);toggleClock();advance(999);yes(state.result.title===&#x27;Oxygen depleted&#x27;,&#x27;oxygen end&#x27;);near(state.elapsed,450,&#x27;deadline&#x27;);
      closeDialog(false);newFlight();state.mask=1;state.selected=0;state.bearing=180;throwTool();yes(state.result.title===&#x27;Return lost&#x27;,&#x27;empty&#x27;);
      closeDialog(false);newFlight();state.mask=1;state.selected=0;throwTool();yes(state.phase===&#x27;flying&#x27;,&#x27;last coast&#x27;);advance(900);yes(state.result.title===&#x27;Capture confirmed&#x27;,&#x27;last capture&#x27;);
      closeDialog(false);newFlight();state.x=6.2;state.y=0;state.vx=-1;state.vy=0;state.oxygen=course(6.2,0,-1,0).eta;toggleClock();advance(9);yes(state.result.title===&#x27;Capture confirmed&#x27;,&#x27;tie&#x27;);
    });
    test(&#x27;Windup, cancel, keyboard inventory and throw controls&#x27;,()=&gt;{
      document.body.dispatchEvent(new KeyboardEvent(&#x27;keydown&#x27;,{key:&#x27;4&#x27;,bubbles:true}));yes(state.selected===3,&#x27;digit&#x27;);
      document.body.dispatchEvent(new KeyboardEvent(&#x27;keydown&#x27;,{code:&#x27;Space&#x27;,bubbles:true,cancelable:true}));yes(charge?.source===&#x27;key&#x27;,&#x27;space&#x27;);
      charge.start=performance.now()-880;windup(performance.now());near(state.power,50,&#x27;half power&#x27;,1.1);
      document.body.dispatchEvent(new KeyboardEvent(&#x27;keydown&#x27;,{key:&#x27;Escape&#x27;,bubbles:true}));yes(state.throws===0 &amp;&amp; state.power===65 &amp;&amp; charge===null,&#x27;cancel&#x27;);
      beginCharge(&#x27;key&#x27;);charge.start=performance.now()-1900;document.body.dispatchEvent(new KeyboardEvent(&#x27;keyup&#x27;,{code:&#x27;Space&#x27;,bubbles:true}));
      yes(state.power===100&amp;&amp;state.throws===1,&#x27;release&#x27;);
    });
    test(&#x27;A tap previews without spending a tool and a drag previews until release&#x27;,()=&gt;{
      pointer(&#x27;pointerdown&#x27;,0,1);pointer(&#x27;pointerup&#x27;,0,1);
      near(state.power,10,&#x27;floor&#x27;);near(state.bearing,90,&#x27;tap bearing&#x27;);yes(!state.throws,&#x27;tap spent tool&#x27;);
      const half=camera.inner+(camera.reach-camera.inner)*.5;
      pointer(&#x27;pointerdown&#x27;,1,0);pointer(&#x27;pointermove&#x27;,0,half);
      near(state.power,55,&#x27;distance&#x27;);near(state.bearing,90,&#x27;drag bearing&#x27;);yes(!state.throws,&#x27;early release&#x27;);
      const preview=$(&#x27;prediction&#x27;).textContent,d=$(&#x27;targetLine&#x27;).getAttribute(&#x27;y2&#x27;);
      pointer(&#x27;pointermove&#x27;,-camera.reach-1,0);
      near(state.bearing,180,&#x27;live bearing&#x27;);near(state.power,100,&#x27;cap&#x27;);
      yes($(&#x27;prediction&#x27;).textContent!==preview &amp;&amp; $(&#x27;targetLine&#x27;).getAttribute(&#x27;y2&#x27;)!==d,&#x27;live preview&#x27;);
      const k=impulse(state.selected,state.power,state.bearing),vx=state.vx,vy=state.vy;
      pointer(&#x27;pointerup&#x27;,-camera.reach-1,0);pointer(&#x27;pointerup&#x27;,-camera.reach-1,0);
      near(state.vx,vx+k.dx,&#x27;actual vx&#x27;);near(state.vy,vy+k.dy,&#x27;actual vy&#x27;);
      yes(state.throws===1 &amp;&amp; state.mask===62,&#x27;one tool&#x27;);
    });
    test(&#x27;A release uses its final position and keeps the original tool&#x27;,()=&gt;{
      $(&#x27;tools&#x27;).children[3].click();
      pointer(&#x27;pointerdown&#x27;,camera.reach,0);pointer(&#x27;pointermove&#x27;,0,camera.reach);
      pointer(&#x27;pointerup&#x27;,0,camera.reach,{pointerId:8});key(&#x27;1&#x27;);key(&#x27;Enter&#x27;);
      yes(state.selected===3 &amp;&amp; state.throws===0,&#x27;gesture owner&#x27;);
      const velocity=state.vx+impulse(3,10,0).dx;
      pointer(&#x27;pointerup&#x27;,1,0);
      near(state.power,10,&#x27;short release&#x27;);near(state.vx,velocity,&#x27;release impulse&#x27;);yes(!isAvailable(3),&#x27;spent selected tool&#x27;);
    });
    test(&#x27;Interrupted gestures restore aim and preserve inventory&#x27;,()=&gt;{
      for(const action of [&#x27;pointercancel&#x27;,&#x27;lostpointercapture&#x27;,&#x27;Escape&#x27;,&#x27;outside&#x27;,&#x27;guide&#x27;,&#x27;pause&#x27;,&#x27;blur&#x27;,&#x27;reset&#x27;]){
        newFlight();
        if(action===&#x27;pause&#x27;)toggleClock();
        pointer(&#x27;pointerdown&#x27;,2,1);pointer(&#x27;pointermove&#x27;,0,camera.reach);
        if(action===&#x27;Escape&#x27;)key(&#x27;Escape&#x27;);
        else if(action===&#x27;outside&#x27;)pointer(&#x27;pointerup&#x27;,plotW,0);
        else if(action===&#x27;guide&#x27;){$(&#x27;guide&#x27;).click();closeDialog();}
        else if(action===&#x27;pause&#x27;){toggleClock();}
        else if(action===&#x27;blur&#x27;)backgroundPause();
        else if(action===&#x27;reset&#x27;)newFlight();
        else pointer(action,0,10);
        pointer(&#x27;pointerup&#x27;,camera.reach,0);
        yes(!drag &amp;&amp; state.mask===63 &amp;&amp; state.throws===0 &amp;&amp; state.bearing===0 &amp;&amp; state.power===65,action);
      }
    });
    test(&#x27;Paused or ended missions and an empty rack ignore pointer input&#x27;,()=&gt;{
      for(const phase of [&#x27;paused&#x27;,&#x27;ended&#x27;,&#x27;empty&#x27;]){

        yes(!drag &amp;&amp; !state.throws &amp;&amp; state.power===65,phase);
      }
    });

    test(&#x27;Menu configuration, full-power reach and narrow layout&#x27;,()=&gt;{
